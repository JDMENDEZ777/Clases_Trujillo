<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Registro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="register-page">
  <div class="register-card">
    <div class="card-header">
      <div class="badge">Registro</div>
      <h1>Crear Cuenta</h1>
      <p class="hint">Regístrate para continuar con tus compras</p>
    </div>

    <form (ngSubmit)="register()" autocomplete="off">
      <ion-item>
        <ion-label position="floating">Nombre completo</ion-label>
        <ion-input type="text" required [(ngModel)]="formData.name" name="name"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Correo electrónico</ion-label>
        <ion-input type="email" required [(ngModel)]="formData.email" name="email"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input type="password" required [(ngModel)]="formData.password" name="password"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Confirmar contraseña</ion-label>
        <ion-input type="password" required [(ngModel)]="formData.confirmPassword" name="confirmPassword"></ion-input>
      </ion-item>

      <ion-button expand="block" type="submit">Registrarse</ion-button>
    </form>

    <div class="login-link">
      <p>¿Ya tienes cuenta? <a (click)="goToLogin()">Ingresa aquí</a></p>
    </div>

    <ion-text color="success" *ngIf="successMessage" class="success-text">
      <p>✓ {{ successMessage }}</p>
    </ion-text>

    <ion-text color="danger" *ngIf="errorMessage" class="error-text">
      <p>✗ {{ errorMessage }}</p>
    </ion-text>
  </div>
</ion-content>
